included:
  - Notra

excluded:
  - Icon
  - Scripts
  - NotraTests
  - NotraUITests
  - Notra.xcodeproj

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - optional_enum_case_matching
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo
  - trailing_comma
  - file_length
  - function_body_length
  - modifier_order

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

type_body_length:
  warning: 350
  error: 500

cyclomatic_complexity:
  warning: 12
  error: 18

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - dx
    - dy
    - i
    - j

large_tuple:
  warning: 3
  error: 4

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 4

reporter: xcode
